<!DOCTYPE html>
<html lang="pt-br"></html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cálculo Refino</title>
  <style>
    .resultado {
      margin-top: 2rem;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: flex-start;
    }
    .resultado table {
      border-collapse: collapse;
      min-width: 250px;
      background: #f8fafc;
      box-shadow: 0 2px 8px #0001;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .resultado th, .resultado td {
      padding: 0.7em 1.2em;
      text-align: center;
    }
    .resultado th {
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      letter-spacing: 1px;
      border-bottom: 2px solid #1e40af;
    }
    .resultado td {
      background: #e0e7ef;
      color: #222;
      font-size: 1.1em;
      border-bottom: 1px solid #cbd5e1;
      transition: background 0.2s;
    }
    .resultado tr:last-child td {
      border-bottom: none;
    }
    .resultado table {
      margin-right: 1.5rem;
    }
    @media (max-width: 700px) {
      .resultado {
        flex-direction: column;
        gap: 1rem;
      }
      .resultado table {
        margin-right: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div>
    <main>
      <div><h1>Cálculo de Refino de Recursos</h1></div>
      <form action="/script.js" method="post">
        <label for="grau">Grau:</label>
        <select id="grau">
          <option value="G2">G2</option>
          <option value="G3">G3</option>
          <option value="G4">G4</option>
          <option value="G5" selected>G5</option>
        </select>
        <label for="quantidade">Quantidade</label>
        <input type="number" id="quantidade" min="1" value="300">
        <button type="button" id="calcularRefino">Calcular</button>
      </form>
      <div class="resultado">
        <table border="1">
          <thead>
            <tr>
              <th>G2</th>
              <th>G3</th>
              <th>G4</th>
              <th>G5</th>
              <th>Total de Barras</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td id="qtdG2"></td>
              <td id="qtdG3"></td>
              <td id="qtdG4"></td>
              <td id="qtdG5"></td>
              <td id="qtdBarras"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

</body>
<script src="script.js"></script>
</html>
